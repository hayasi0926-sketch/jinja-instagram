<!DOCTYPE html>

      <p class="kicker" data-text="series"></p>

      <ul class="check-list" style="margin-top:14px;">

        <li data-text="slide4.item2"></li>
        <li data-text="slide4.item3"></li>
      </ul>

      <div class="grow"></div>

      <div class="dm-pill" style="margin-bottom:26px;">

      <p class="body-text" style="font-size:17px; color:var(--ink-faint); margin-bottom:150px;" data-text="slide4.closing"></p>

      <div class="name">神社アプリ<span>Jinja App</span></div>
    </div>

  <script src="./content.js"></script>
  <script src="../../shared/apply-content.js"></script>
