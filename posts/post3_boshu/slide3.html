<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="stylesheet" href="../../shared/styles.css">
<style>

<body data-slide="slide3">

        <path d="M14 21 L14 43" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M34 21 L34 43" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>

  <script src="./content.js"></script>
  <script src="../../shared/apply-content.js"></script>
