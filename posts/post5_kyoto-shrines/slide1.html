<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>投稿⑤ 1/4 - 表紙</title>
<link rel="stylesheet" href="../../shared/styles.css">
</head>
<body data-slide="slide1">
  <div class="slide">
    <div class="slide-texture"></div>
    <div class="slide-frame"></div>

    <svg class="bg-motif" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M40 120 L360 120" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
      <path d="M70 150 L330 150" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
      <path d="M110 150 L110 380" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>

    <div class="slide-content pad-block" style="padding-top:150px;">
      <p class="kicker" data-text="series"></p>
      <h1 class="title-main size-cover" data-text="slide1.title" style="margin-top:44px; max-width:820px;"></h1>
      <div class="gold-rule"></div>
      <p class="title-sub size-cover" data-text="slide1.subtitle" style="max-width:600px;"></p>

      <div class="grow"></div>

      <div class="swipe-hint" style="margin-bottom:150px;">
        <span data-text="slide1.swipe_hint"></span>
        <span class="arrow"></span>
      </div>
    </div>

    <div class="page-indicator"><span class="current">01</span>&nbsp;/&nbsp;04</div>
    <div class="footer-brand">
      <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">

        <path d="M14 21 L14 43" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M34 21 L34 43" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M24 9 L24 15" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <div class="name">神社アプリ<span>Jinja App</span></div>
    </div>
  </div>

  <script src="./content.js"></script>
  <script src="../../shared/apply-content.js"></script>
