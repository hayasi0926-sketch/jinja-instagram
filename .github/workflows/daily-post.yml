# 毎日 21:00 (JST) に posts/manifest.json の次の "ready" 投稿を Instagram に公開し、
# 更新した manifest.json をコミットする。PC の電源が切れていても GitHub 上で動く。
# 必要な Secrets: IG_ACCESS_TOKEN, IG_BUSINESS_ACCOUNT_ID, GITHUB_RAW_BASE
name: Daily Instagram post

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC = 21:00 JST（混雑時は数十分遅れることがある）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GITHUB_RAW_BASE: ${{ secrets.GITHUB_RAW_BASE }}
        run: node scripts/post-to-instagram.js

      - name: Commit manifest
        run: |
          if git diff --quiet posts/manifest.json; then
            echo "manifest.json に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/manifest.json
          git commit -m "Mark post as posted (GitHub Actions)"
          git pull --rebase
          git push
